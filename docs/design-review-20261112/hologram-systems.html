<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAM · 버튼 / 폰트 / 테마 비교</title>
<style>
@font-face{font-family:SUIT;src:url('../../apps/control-room/src/assets/fonts/SUIT-Variable.woff2')}@font-face{font-family:Pretendard;src:url('../../apps/control-room/src/assets/fonts/PretendardVariable.woff2')}@font-face{font-family:Orbit;src:url('../../apps/control-room/src/assets/fonts/Orbit-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#040a12;color:#d9ecf5;font-family:SUIT,sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% -20%,#153047,transparent 60%)}main{padding:42px 46px;max-width:2048px;margin:auto;position:relative}.intro{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #bddff52a;padding-bottom:24px;margin-bottom:28px}.intro small{letter-spacing:.3em;font-size:10px;color:#91bdce}.intro h1{font-size:30px;font-weight:500;letter-spacing:-.025em;margin:12px 0 0}.intro p{font-size:13px;color:#a7bdcc;margin:0;line-height:1.9;text-align:right}.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.theme{--a:#9be9ff;--b:#245263;--gold:#f7d193;position:relative;min-width:0;isolation:isolate;overflow:hidden;border:1px solid #7fa5b535;background:#081523;box-shadow:inset 0 1px #c3f1ff18,0 25px 45px #0009;padding:27px 28px 26px;border-radius:18px 18px 4px 4px}.theme:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 0,#8ae8ff12,transparent 65%),linear-gradient(160deg,#14263730,#02090e88)}.chrome{--a:#bee3ff;--b:#3f586b;background:#0e141d;font-family:Pretendard,sans-serif}.opal{--a:#c3b1ff;--b:#464c7a;--gold:#d5edff;background:#101020;font-family:Orbit,sans-serif}.theme-header{margin-bottom:26px;display:flex;align-items:flex-start;gap:15px}.theme-number{font-family:SUIT;font-size:14px;color:var(--a);border:1px solid #9ccbd345;padding:8px 11px;border-radius:50%;background:#c9eaff0c}.theme-header small{color:var(--a);font:500 9px SUIT;letter-spacing:.2em}.theme-header h2{font-size:26px;line-height:1.4;font-weight:500;margin:4px 0 6px}.theme-header p{font-size:12px;color:#a5bdca;line-height:1.65;margin:0}.font-sample{border-block:1px solid #8daebb30;padding:18px 0 19px;margin-bottom:24px}.font-caption{display:flex;justify-content:space-between;font:11px SUIT;color:#8ea8ba;margin-bottom:13px}.font-sample .sample{font-size:23px;line-height:1.5;color:#ebf6ff;margin-bottom:8px}.font-sample .numerals{font-size:14px;letter-spacing:.1em;color:var(--a)}.demo-stage{position:relative;isolation:isolate;padding:18px 18px 24px;background:radial-gradient(ellipse at 50% 30%,#28445770,transparent 70%),linear-gradient(160deg,#04101df0,#02101b);border:1px solid #89b9ce30;border-radius:10px;overflow:hidden}.demo-stage:before{content:'';z-index:-1;position:absolute;inset:0;background-image:linear-gradient(#8fdcff0a 1px,transparent 1px),linear-gradient(90deg,#8fdcff0a 1px,transparent 1px);background-size:36px 36px;transform:perspective(250px) rotateX(25deg);opacity:.7}.demo-label{font:10px SUIT;color:#94b6ca;letter-spacing:.1em;margin-bottom:15px}.glass-button{position:relative;isolation:isolate;display:flex;justify-content:center;align-items:center;gap:12px;border:0;background:none;color:#edfbff;cursor:pointer;text-decoration:none;font:500 15px/1.5 inherit;font-family:inherit;padding:15px 25px;min-height:56px;text-shadow:0 1px 3px #00101b;transition:filter .2s,transform .2s}.glass-button svg.plate{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;pointer-events:none}.glass-button svg.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.3;fill:none;flex:none;filter:drop-shadow(0 0 5px #a9eaff66)}.glass-button:hover{filter:brightness(1.22);transform:translateY(-1px)}.glass-button:focus-visible{outline:2px solid #e0f6ff;outline-offset:5px}.glass-button:active{transform:translateY(2px)}.primary{width:100%;min-height:70px;filter:drop-shadow(0 10px 10px #0009);font-size:17px;letter-spacing:.03em}.primary strong{font-weight:550}.primary small{display:block;font:9px SUIT;letter-spacing:.2em;color:#e5c895;margin-top:3px}.primary .arrow{font:24px SUIT;margin-left:auto}.glass-row{display:flex;gap:16px;margin-top:22px}.glass-row .glass-button{flex:1;min-width:0;font-size:13px;padding:12px 9px}.role-note{font:11px/1.7 SUIT;color:#91acbd;margin:13px 0 0}.mini-screen{position:relative;isolation:isolate;margin-top:28px;padding:22px 20px 18px;border-radius:3px 18px 3px 18px;border:1px solid #9bdded55;background:linear-gradient(140deg,#2c536374,#0e263655 50%,#07101fc9);box-shadow:inset 0 1px #e0faff57,inset 4px 0 #c7f3ff0d,0 10px 20px #0004}.chrome .mini-screen{border-radius:13px;border-color:#bac9d54d;background:linear-gradient(135deg,#5e76804d,#121c2c99);box-shadow:inset 0 1px #f4fcff44,inset 0 -2px #000a,0 9px 24px #0008}.opal .mini-screen{border-radius:23px;border-color:#c5beff55;background:linear-gradient(140deg,#9e90db25,#1a244b70);box-shadow:inset 0 1px #f2efff55,0 0 20px #8181ff16}.panel-kicker{font:9px SUIT;letter-spacing:.19em;color:var(--a)}.mini-screen h3{font-size:20px;font-weight:500;line-height:1.4;margin:9px 0 18px}.tab-row{display:flex;gap:6px;border-bottom:1px solid #9ec7d437;padding-bottom:13px;margin-bottom:16px}.tab{position:relative;flex:1;isolation:isolate;color:#a1bbce;padding:9px 4px;min-height:38px;font-size:12px}.tab[aria-selected=true]{color:#e5f8ff}.tab[aria-selected=true]:before{content:'';position:absolute;inset:0;z-index:-1;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);background:linear-gradient(155deg,#87defa30,#337f9b0a);border-block:1px solid #9ce7ff8c}.chrome .tab[aria-selected=true]:before{border:1px solid #c5e3ff55;border-radius:8px;clip-path:none;background:linear-gradient(#cbe4ff20,#a5d8ff08);box-shadow:inset 0 1px #fff5}.opal .tab[aria-selected=true]:before{border:1px solid #d3c4ff88;border-radius:30px;clip-path:none;background:linear-gradient(135deg,#bfa5ff44,#87ccff22);box-shadow:0 0 10px #b293ff22}.cargo-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;padding-bottom:18px}.cargo-line small{display:block;font:11px SUIT;color:#91afc0;margin-top:6px}.cargo-line b{font-size:21px;font-weight:500;color:var(--a);white-space:nowrap}.status-row{display:flex;gap:8px;flex-wrap:wrap;font:10px SUIT}.status{border:1px solid #a5c0d040;border-radius:4px;padding:6px 9px;background:#9bbccc09;color:#a3c1d1}.status.confirmed{color:#b5eee6;border-color:#91e2d454;background:#6cd9ca0d}.status.estimate{color:#f2d09c;border-color:#d6ad6866;background:#e7b8660b}.theme-footer{margin-top:22px;padding-top:18px;border-top:1px solid #8daebb30}.theme-footer p{font:12px/1.8 SUIT;color:#a8becd;margin:0}.palette{display:flex;gap:7px;margin-bottom:11px}.palette i{display:block;width:24px;height:7px;border-radius:3px;background:var(--color)}.footnote{margin:24px 0 0;font:12px/1.7 SUIT;color:#8aa6b7}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.quiet{border:0;background:none;color:#a1bece;padding:8px;font:12px inherit;font-family:inherit;cursor:pointer}.quiet:hover{color:#effaff}.icon-control{width:40px;height:40px;min-height:40px;padding:9px;border-radius:50%;border:1px solid #a7d1e04d;background:radial-gradient(circle at 35% 20%,#b6eeff20,#0c2133);box-shadow:inset 0 1px #d1f7ff55,0 3px 7px #0009}.icon-control svg{width:19px;height:19px}.chrome .icon-control{border:3px solid #beced857;background:radial-gradient(circle at 35% 20%,#cce9fa22,#101d2a);box-shadow:0 0 0 1px #02080f,inset 0 0 0 1px #e7faff7d,0 0 11px #a4dfff21}.opal .icon-control{border-color:#c4b5ff88;background:linear-gradient(135deg,#d2bfff33,#729fff22);box-shadow:inset 0 1px #f3ecff8c,0 0 11px #ad87ff3c}
@media(max-width:1100px){.themes{grid-template-columns:1fr}.intro{display:block}.intro p{text-align:left;margin-top:15px}.theme{max-width:680px;margin:auto;width:100%}}
</style>
<main><header class="intro"><div><small>STAM / INTERFACE MATERIAL STUDY · 01</small><h1>버튼 · 폰트 · 테마를 한 세트로</h1></div><p>주요 실행은 입체감 있게 · 일반 조작은 절제해서 · 탭과 상태는 가볍게<br>실제 폰트와 동작하는 버튼으로 비교하는 디자인 시안</p></header><div class="themes" id="themes"></div><p class="footnote">주요 실행 / 일반 조작 / 화면 탭 / 원형 도구 / 정보 상태를 각각 설계했습니다. 글자는 이미지에 넣지 않고 실제 폰트로 표시합니다.</p></main>
<script>
const themes=[{id:'prism',name:'투사 유리',english:'PRISM / CLEAR HOLOGRAM',font:'SUIT',description:'청록 투명 유리 · 잘린 모서리 · 얇은 금색 실행 강조',note:'안내데스크의 승인된 홀로그램과 연결되는 구성. 두꺼운 유리 버튼은 주요 실행에만 사용하고, 탭과 상태는 얇게 유지합니다.',colors:['#091c2a','#7adfff','#e9f8ff','#e7bd7d']},{id:'chrome',name:'크롬 오비트',english:'ORBIT / CHROME & LIGHT',font:'Pretendard',description:'훈연 유리 · 은색 금속 테두리 · 청백색 링 조명',note:'금속과 유리의 층이 보이는 구성. 일반 버튼은 낮고 넓게, 작은 도구는 원형 링으로 묶어 관제 장비의 느낌을 냅니다.',colors:['#0b111b','#8b9ba9','#d7efff','#75caff']},{id:'opal',name:'오팔 스펙트럼',english:'SPECTRA / OPAL GLASS',font:'Orbit',description:'청보라 유리 · 부드러운 입체 가장자리 · 오팔빛 반사',note:'예시의 네온과 밝은 유리 재질을 조합한 구성. 발광은 가장자리와 선택 상태에 모으고, 한글에도 SF 형태의 서체를 씁니다.',colors:['#13152a','#b6a2ff','#a9dfff','#f0ecff']}];
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${name==='rocket'?'<path d="m5 14 5-1 1-5 9-5-3 10-5 1-2 5-2-4Zm6-6 6 6M6 18l-3 3"/>':name==='upload'?'<path d="M4 15v5h16v-5M12 16V3m-5 5 5-5 5 5"/>':name==='route'?'<circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M5 16v-3c0-5 14 3 14-3V8"/>':'<path d="M6 12h12M12 6v12"/>'}</svg>`;
let serial=0;
function plate(theme,primary=false){const id='p'+serial++,c=theme==='opal'?'#c1b0ff':theme==='chrome'?'#c9e7ff':'#90e7ff',gold=primary&&theme==='prism',edge=gold?'#f1d197':c;
const shape=theme==='prism'?'M13 3H382L397 18V61L384 74H13L3 64V14Z':theme==='chrome'?'M32 3H368Q397 3 397 34V44Q397 74 368 74H32Q3 74 3 44V34Q3 3 32 3Z':'M30 3H370Q397 3 397 30V47Q397 74 370 74H30Q3 74 3 47V30Q3 3 30 3Z';
return `<svg class="plate" viewBox="0 0 400 82" preserveAspectRatio="none"><defs><linearGradient id="${id}rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f6fcff"/><stop offset=".15" stop-color="${edge}"/><stop offset=".42" stop-color="#163544"/><stop offset=".72" stop-color="${edge}" stop-opacity=".7"/><stop offset="1" stop-color="#edfaff" stop-opacity=".9"/></linearGradient><linearGradient id="${id}face" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="${gold?'#c5a76e':c}" stop-opacity="${theme==='opal'?'.5':'.3'}"/><stop offset=".45" stop-color="${gold?'#524d36':theme==='opal'?'#474978':'#183544'}" stop-opacity=".85"/><stop offset="1" stop-color="#061522" stop-opacity=".95"/></linearGradient><linearGradient id="${id}shine"><stop stop-color="#effaff" stop-opacity=".5"/><stop offset=".35" stop-color="#effaff" stop-opacity=".03"/><stop offset=".7" stop-color="#effaff" stop-opacity=".01"/><stop offset="1" stop-color="${edge}" stop-opacity=".3"/></linearGradient><filter id="${id}glow" x="-.1" y="-.8" width="1.2" height="2.6"><feGaussianBlur stdDeviation="${primary?'2.2':'1.1'}"/></filter></defs><path d="${shape}" transform="translate(0 5)" fill="#020811" stroke="#01060b" stroke-width="3"/><path d="${shape}" fill="none" stroke="${edge}" stroke-width="${primary?'3':'1.5'}" opacity=".6" filter="url(#${id}glow)"/><path d="${shape}" transform="translate(0 2)" fill="#06101b" stroke="url(#${id}rim)" stroke-width="${theme==='chrome'?'3.5':'2'}"/><path d="${shape}" fill="url(#${id}face)" stroke="url(#${id}rim)" stroke-width="1.3"/><path d="${shape}" transform="translate(8 4) scale(.96 .86)" fill="none" stroke="${edge}" stroke-opacity=".3" stroke-width=".6"/><path d="M${theme==='prism'?'17':'34'} 8H365" stroke="url(#${id}shine)" stroke-width="2" stroke-linecap="round"/><path d="M28 12 10 49" stroke="#effaff" stroke-opacity=".22" stroke-width="3"/><path d="M40 68H350" stroke="${edge}" stroke-width=".8" opacity=".5"/>${theme==='prism'?`<path d="M19 3h28M352 74h28" stroke="${gold?'#ffe0a0':'#bdedff'}" stroke-width="2"/>`:''}${theme==='opal'?'<path d="M350 5h20q22 0 23 22" fill="none" stroke="#f0e7ff" stroke-width="2"/><path d="M6 50q0 22 22 22h32" fill="none" stroke="#a4ecff" stroke-width="2"/>':''}</svg>`}
for(const [i,t] of themes.entries()){const b=(text,name='upload')=>`<button class="glass-button">${plate(t.id)}${icon(name)}${text}</button>`;document.getElementById('themes').insertAdjacentHTML('beforeend',`<section class="theme ${t.id}"><header class="theme-header"><span class="theme-number">0${i+1}</span><div><small>${t.english}</small><h2>${t.name}</h2><p>${t.description}</p></div></header><div class="font-sample"><div class="font-caption"><span>FONT / ${t.font}</span><span>한글 · 영문 · 수치</span></div><div class="sample">항로를 펼치고, 다음 운송을 준비하세요.</div><div class="numerals">STAM · 128 SCU / 42,500 aUEC</div></div><div class="demo-stage"><div class="demo-label">주요 실행 · 입체 유리 + 선택 조명</div><button class="glass-button primary">${plate(t.id,true)}${icon('rocket')}<span><strong>경로 계산하기</strong><small>CALCULATE ROUTE</small></span><span class="arrow">↗</span></button><div class="glass-row">${b('로그 불러오기')}${b('직접 입력','plus')}</div><p class="role-note">일반 조작은 낮은 유리판 · 실행 버튼보다 약한 조명</p></div><section class="mini-screen"><small class="panel-kicker">MISSION / CONTRACT INTAKE</small><h3>이번 운송을 준비하세요</h3><div class="tab-row" role="tablist"><button class="glass-button tab" role="tab" aria-selected="true">미션 콘솔</button><button class="glass-button tab" role="tab" aria-selected="false">항로 지도</button><button class="glass-button tab" role="tab" aria-selected="false">관제 콘솔</button></div><div class="cargo-line"><span>선택한 계약<small>로빌 → 에어리어 18</small></span><b>128 SCU</b></div><div class="status-row"><span class="status confirmed">총량 확인</span><span class="status estimate">최대치 예상</span><span class="status">수량 미확인</span></div><div class="controls"><button class="quiet">상세 확인 →</button><button class="glass-button icon-control" aria-label="방문 순서">${icon('route')}</button></div></section><footer class="theme-footer"><div class="palette">${t.colors.map(c=>`<i style="--color:${c}"></i>`).join('')}</div><p>${t.note}</p></footer></section>`)}
document.querySelectorAll('[role=tab]').forEach(tab=>tab.onclick=()=>{tab.parentElement.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===tab?'true':'false'))});
</script></html>
