<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAM 승인 원본 복원 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061018;color:#edf8fc;font-family:system-ui,sans-serif}
.stage{position:relative;width:100%;aspect-ratio:1671/941;margin:0;overflow:hidden}
.approved-art{display:block;width:100%;height:100%;object-fit:contain}
.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;color:transparent;font:inherit}
.hit:focus-visible{outline:2px solid #fff0bf;outline-offset:3px}
.hit span{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
[data-action=mission]{left:7.7%;top:41.2%;width:22.2%;height:8.1%}
[data-action=guide]{left:7.7%;top:50.4%;width:22.2%;height:7.3%}
[data-action=information]{left:7.7%;top:58.5%;width:22.2%;height:7.5%}
[data-action=lounge]{left:7.7%;top:66.6%;width:22.2%;height:7.4%}
[data-action=help]{left:70.7%;top:56.3%;width:23.8%;height:7.8%}
[data-action=prepare]{left:70.7%;top:64.3%;width:23.8%;height:8.4%}
.review{padding:18px 24px;font-size:14px;line-height:1.6}.review p{margin:0 0 8px}
</style>
<main class="stage" aria-label="사용자 승인 원본과 같은 패널·글씨 복원 검수">
 <img class="approved-art" src="../lounge-guide/lounge-guide-hologram-ui-v1.png" alt="중앙 가이드, 왼쪽 기능 홀로그램과 오른쪽 대화 홀로그램. 승인된 원본 그대로." width="1671" height="941">
 <button class="hit" data-action="mission"><span>첫 운송 시작</span></button>
 <button class="hit" data-action="guide"><span>운송 절차 안내</span></button>
 <button class="hit" data-action="information"><span>함선·화물 정보</span></button>
 <button class="hit" data-action="lounge"><span>라운지로 돌아가기</span></button>
 <button class="hit" data-action="help"><span>처음이에요. 안내해 주세요.</span></button>
 <button class="hit" data-action="prepare"><span>운송 준비부터 시작할게요.</span></button>
</main>
<aside class="review"><p>승인 원본을 그대로 표시하는 외형 검수 화면입니다. 그림·폰트를 새로 그리지 않았습니다.</p><p>실제 앱 연결·대기 영상 합성은 이 검수 화면과 별개입니다.</p><output id="action" aria-live="polite"></output></aside>
<script>
document.querySelectorAll('.hit').forEach(button=>button.addEventListener('click',()=>{
 document.querySelector('#action').textContent='버튼 영역 확인: '+button.textContent.trim();
}));
</script>
</html>
