<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAM · 새 가이드 자산 비교</title><link rel="stylesheet" href="tour.css"><style>
body{padding:22px}.asset-header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.asset-header p{max-width:860px;line-height:1.8;color:#9ebbc9}.asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.asset-grid figure{margin:0;background:#0b202b;border:1px solid #73adbd44;border-radius:6px;overflow:hidden}.asset-grid .photo{height:560px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at center,#244250,#07131e)}.asset-grid img{max-width:100%;height:96%;width:auto;object-fit:contain;object-position:center bottom}.asset-grid figcaption{padding:15px 18px;line-height:1.8}.asset-grid figcaption span{display:block;color:#9bbcca;font-size:12px}.asset-grid figcaption a{font-size:12px}.asset-grid figure:first-child{border-color:#e2c58c}.asset-grid.light .photo{background:#c8ced1}.asset-grid.scene .photo{background:url('/apps/control-room/src/assets/lounge-original-composite.png') center/cover}.asset-grid.faces .photo{height:250px;align-items:flex-start;overflow:hidden}.asset-grid.faces img{width:100%;height:auto;max-width:100%;object-position:center top}.asset-header button{padding:9px 14px;border:1px solid #76afc04d;background:#102533}.note{padding:0}@media(max-width:900px){.asset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.asset-grid .photo{height:480px}}@media(max-width:520px){body{padding:12px}.asset-grid{grid-template-columns:1fr}.asset-grid .photo{height:580px}}
</style></head><body><header class="asset-header"><a href="index.html">← 라운지 투어로</a><strong>GUIDE / NEW POSE ASSETS</strong><p>승인 기준과 새 자세를 같은 높이로 비교합니다. 새 자산은 검토 중이며, 원본과 완전히 같은 얼굴이라고 단정하지 않습니다. 비율을 과하게 늘린 버전과 얼굴이 달라진 초기 버전은 사용하지 않습니다.</p><div><button id="face-toggle" aria-pressed="false">얼굴 비교</button> <button data-background="">어두운 배경</button> <button data-background="light">밝은 배경</button> <button data-background="scene">라운지 위에서</button></div></header><main class="asset-grid" id="asset-grid">
<figure><div class="photo"><img src="../desk-cinema-25d-20261113/assets/guide-entrance.png" alt="승인된 기존 가이드 전신 비율"></div><figcaption>기준 · 승인한 전신<span>얼굴과 전신 비율의 비교 기준</span></figcaption></figure>
<figure><div class="photo"><img src="assets/guide-escort.png" alt="새로 제작한 돌아보며 인솔하는 자세"></div><figcaption>01 · 앞서 인솔<span>시네마로 이동하는 구간</span><a href="assets/guide-escort.png">투명 PNG 원본</a></figcaption></figure>
<figure><div class="photo"><img src="assets/guide-cinema.png" alt="새로 제작한 손바닥으로 장소를 소개하는 자세"></div><figcaption>02 · 장소 소개<span>시네마 앞 · 도착 후 화면 안내</span><a href="assets/guide-cinema.png">투명 PNG 원본</a></figcaption></figure>
<figure><div class="photo"><img src="assets/guide-archive.png" alt="전신 비율을 기준으로 다시 편집한 설명 자세"></div><figcaption>03 · 자료 설명<span>아카이브 앞 · 도착 후 화면 안내</span><a href="assets/guide-archive.png">투명 PNG 원본</a></figcaption></figure>
<figure><div class="photo"><img src="assets/guide-service.png" alt="새로 제작한 두 손을 모은 응대 자세"></div><figcaption>04 · 응대<span>서비스센터 앞 · 도착 후 화면 안내</span><a href="assets/guide-service.png">투명 PNG 원본</a></figcaption></figure>
<figure><div class="photo"><img src="assets/guide-waiting.png" alt="얼굴을 다시 편집한 머리를 정리하며 기다리는 자세"></div><figcaption>05 · 기다리기<span>게이트 도착 후 · 얼굴 재편집본</span><a href="assets/guide-waiting.png">투명 PNG 원본</a></figcaption></figure>
</main><script>document.querySelectorAll('[data-background]').forEach(b=>b.addEventListener('click',()=>{const grid=document.getElementById('asset-grid');grid.classList.remove('light','scene');if(b.dataset.background)grid.classList.add(b.dataset.background);}));document.getElementById('face-toggle').addEventListener('click',e=>{const faces=document.getElementById('asset-grid').classList.toggle('faces');e.currentTarget.setAttribute('aria-pressed',String(faces));e.currentTarget.textContent=faces?'전신 비교':'얼굴 비교';});</script></body></html>
