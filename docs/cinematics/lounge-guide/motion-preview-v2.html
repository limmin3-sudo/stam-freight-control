.rim{fill:none;stroke:#a8f4ff;stroke-width:1.1;vector-effect:non-scaling-stroke}.rim.outer{stroke:#66d9ed;stroke-width:1.6}.rim.inner{stroke:#7ce3ee;stroke-opacity:.55;stroke-width:.65}.rim.sheen{stroke:#dcfcff;stroke-opacity:.35;stroke-width:3}.gold{stroke:#ffd58a;stroke-width:2.2;fill:none;filter:url(#gold-glow)}.hot{fill:none;stroke:#b9f8ff;stroke-width:3.5;filter:url(#cyan-glow)}
.action-shape{--action-fill:#7eeaff0b;--action-stroke:#9beef5;--action-width:1}.selected .action-shape{--action-fill:#ffdb7820;--action-stroke:#ffd58a;--action-width:1.7}.holo-action:hover .action-shape{--action-fill:#a9f5ff1a;--action-stroke:#e1fcff}.holo-action.selected:hover .action-shape{--action-fill:#ffdb782b;--action-stroke:#ffecc5}.bottom .action-shape{--action-fill:#0c344152;--action-stroke:#83e3ef}

<header class="toolbar"><button id="toggle" type="button" aria-controls="stage" aria-expanded="false">UI 펼치기</button><button id="replay" type="button">등장·퇴장 다시 보기</button><button id="extras" type="button" aria-pressed="false">하단 바 포함</button><span id="status" class="status" aria-live="polite">수납</span></header>
<main class="stage closed" id="stage" data-extras="false" aria-label="승인 디자인의 홀로그램 슬라이드 시안">

    <svg class="frame" viewBox="0 0 460 520" preserveAspectRatio="none" aria-hidden="true"><use href="#frame-shape"/></svg><div class="floor-light"></div>
    <div class="panel-content"><p class="eyebrow">STAM / WELCOME</p><div class="header-line"></div><h1>무엇을 도와드릴까요?</h1>
      <div class="actions">
        <button class="holo-action selected" type="button"><svg class="action-shape" preserveAspectRatio="none" viewBox="0 0 400 70" aria-hidden="true"><path d="M13 1H386L399 14V56L386 69H13L1 57V14Z"/></svg><svg class="icon" aria-hidden="true"><use href="#plane"/></svg><span>첫 운송 시작</span></button>
        <button class="holo-action" type="button"><svg class="action-shape" preserveAspectRatio="none" viewBox="0 0 400 70" aria-hidden="true"><path d="M13 1H386L399 14V56L386 69H13L1 57V14Z"/></svg><svg class="icon" aria-hidden="true"><use href="#clipboard"/></svg><span>운송 절차 안내</span></button>
        <button class="holo-action" type="button"><svg class="action-shape" preserveAspectRatio="none" viewBox="0 0 400 70" aria-hidden="true"><path d="M13 1H386L399 14V56L386 69H13L1 57V14Z"/></svg><svg class="icon" aria-hidden="true"><use href="#box"/></svg><span>함선·화물 정보</span></button>

      <p class="greeting" id="greeting" aria-live="polite">STAM에 오신 것을 환영합니다.<br>첫 운송을 함께 준비해 볼까요?</p><div class="dialog-divider"></div>
      <div class="replies"><button class="holo-action" type="button"><svg class="action-shape" preserveAspectRatio="none" viewBox="0 0 400 70" aria-hidden="true"><path d="M13 1H386L399 14V56L386 69H13L1 57V14Z"/></svg><svg class="icon" aria-hidden="true"><use href="#speech"/></svg><span>처음이에요. 안내해 주세요.</span></button><button class="holo-action" type="button"><svg class="action-shape" preserveAspectRatio="none" viewBox="0 0 400 70" aria-hidden="true"><path d="M13 1H386L399 14V56L386 69H13L1 57V14Z"/></svg><svg class="icon" aria-hidden="true"><use href="#speech"/></svg><span>운송 준비부터 시작할게요.</span></button></div>
    </div>

<script>
const stage=document.getElementById('stage'),toggle=document.getElementById('toggle'),status=document.getElementById('status'),extras=document.getElementById('extras');let opened=false,timers=[];
const bottom=stage.querySelector('.bottom');['라운지','관제센터','서비스센터','정보실','영상관'].forEach(label=>{const b=document.createElement('button');b.type='button';b.className='holo-action';b.innerHTML='<svg class="action-shape" preserveAspectRatio="none" viewBox="0 0 400 70" aria-hidden="true"><path d="M13 1H386L399 14V56L386 69H13L1 57V14Z"/></svg><span></span>';b.querySelector('span').textContent=label;bottom.append(b);});
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function show(value){opened=value;stage.classList.toggle('closed',!value);stage.querySelectorAll('.ui').forEach(el=>{el.inert=!value;el.setAttribute('aria-hidden',String(!value));});toggle.textContent=value?'UI 접기':'UI 펼치기';toggle.setAttribute('aria-expanded',String(value));status.textContent=value?'펼쳐짐':'수납';}
toggle.addEventListener('click',()=>{clearTimers();show(!opened);});
document.getElementById('replay').addEventListener('click',()=>{clearTimers();show(false);timers.push(setTimeout(()=>show(true),800),setTimeout(()=>show(false),3000),setTimeout(()=>show(true),4000));});
extras.addEventListener('click',()=>{const next=stage.dataset.extras!=='true';extras.setAttribute('aria-pressed',String(next));clearTimers();show(false);timers.push(setTimeout(()=>{stage.dataset.extras=String(next);show(true);},600));});
document.querySelectorAll('.actions .holo-action').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.actions .holo-action').forEach(b=>b.classList.toggle('selected',b===button));}));
document.querySelectorAll('.replies .holo-action').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.replies .holo-action').forEach(b=>b.classList.toggle('selected',b===button));}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){clearTimers();show(false);}});show(false);timers.push(setTimeout(()=>show(true),700));
</script>
