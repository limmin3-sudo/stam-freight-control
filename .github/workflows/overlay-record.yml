name: Record Korean overlay partners
on:
  workflow_dispatch:
  push:
    branches: [audio/overlay-partners]
    paths: ['.github/workflows/overlay-record.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/voiceover
            data
            desktop/voices
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - run: python3 tools/voiceover/generate.py --overlay
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-ko
          path: desktop/voices/flight-ko/
  collect:
    if: always() && github.ref == 'refs/heads/audio/overlay-partners'
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/overlay-partners
          sparse-checkout: desktop/voices
      - uses: actions/download-artifact@v4
        with:
          name: overlay-ko
          path: desktop/voices/flight-ko
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- desktop/voices/flight-ko
          git diff --cached --quiet || git commit -m 'Include offline Korean overlay recordings'
          git push origin HEAD:refs/heads/audio/overlay-partners
