name: Rebuild checks
on:
  push:
    branches: ['rebuild/**']
  pull_request:
    paths:
      - 'integration/log/**'
      - 'scripts/log-link*.mjs'
      - 'scripts/build-log-index.mjs'
      - 'tests/log-*.test.mjs'
      - 'tests/launcher.test.mjs'
      - 'data/log-mission-index.json'
      - 'log-link.html'
      - 'start-log-link.cmd'
      - 'render-loop.mjs'
      - 'scene.mjs'
      - 'starmap.mjs'
      - 'bloom.mjs'
      - 'tests/render-loop.test.mjs'
      - '.github/workflows/log-link-checks.yml'
permissions:
  contents: read
concurrency:
  group: log-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26.13.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/log-link.test.mjs tests/log-party.test.mjs tests/log-live.test.mjs tests/render-loop.test.mjs tests/launcher.test.mjs
