name: Rebuild checks
on:
  push:
    branches: ['rebuild/**']
  pull_request:
    paths:
      - 'integration/log/**'
      - 'scripts/log-link*.mjs'
      - 'scripts/build-log-index.mjs'
      - 'scripts/build-log-locations.mjs'
      - 'tests/log-*.test.mjs'
      - 'tests/launcher.test.mjs'
      - 'data/log-mission-index.json'
      - 'data/log-location-index.json'
      - 'log-link.html'
      - 'index.html'
      - 'legacy-planner.html'
      - 'start-log-link.cmd'
      - 'render-loop.mjs'
      - 'scene.mjs'
      - 'cargo-scene.mjs'
      - 'engine.mjs'
      - 'ships.mjs'
      - 'route-departure.mjs'
      - 'tests/resume-integrity.test.mjs'
      - 'starmap.mjs'
      - 'bloom.mjs'
      - 'tests/render-loop.test.mjs'
      - '.github/workflows/log-link-checks.yml'
permissions:
  contents: read
concurrency:
  group: log-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26.13.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare deterministic public coordinates for the full test suite
        run: node -e "require('node:fs').copyFileSync('.github/pages-baseline/locations.json', 'data/locations.json')"
      - run: npm test
