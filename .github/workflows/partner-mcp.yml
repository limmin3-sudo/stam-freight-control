name: Verify partner Worker via Cloudflare MCP
on:
  workflow_dispatch:
    inputs:
      repair:
        description: Repair the known three-partner production Worker and its old build pin
        type: boolean
        default: false
permissions: {}
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install the MCP client
        run: |
          python3 -m venv "$RUNNER_TEMP/partner-mcp"
          "$RUNNER_TEMP/partner-mcp/bin/pip" --disable-pip-version-check install --quiet mcp==1.26.0
      - name: Read the latest production deployment
        env:
          CF_MCP_TOKEN: ${{ secrets.STAM_CLOUDFLARE_MCP_TOKEN }}
        run: |
          "$RUNNER_TEMP/partner-mcp/bin/python" - <<'PY'
          import asyncio
          import os
          from uuid import UUID

          import httpx
          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          async def verify():
              token = os.environ.get("CF_MCP_TOKEN")
              if not token:
                  raise SystemExit("STAM_CLOUDFLARE_MCP_TOKEN is missing.")
              endpoint = "https://mcp.cloudflare.com/mcp"
              headers = {"Authorization": f"Bearer {token}"}
              account = "5fb0f6d0fa99c783973d667151b868aa"
              async with streamablehttp_client(endpoint, headers=headers) as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      reply = await session.call_tool("execute", {
                          "account_id": account,
                          "code": """async () => {
                              const reply = await cloudflare.request({
                                  method: "GET",
                                  path: `/accounts/${accountId}/workers/scripts/stam-partner-chat/deployments`
                              });
                              return reply.result?.deployments?.[0]?.id ?? "unavailable";
                          }""",
                      })
                      if reply.isError:
                          raise SystemExit("Cloudflare MCP could not read the partner Worker deployment.")
                      for block in reply.content:
                          if block.type == "text":
                              try:
                                  deployment = UUID(block.text.strip().strip('"'))
                              except ValueError:
                                  continue
                              print(f"Verified stam-partner-chat deployment {deployment} via Cloudflare MCP.")
                              return
                      raise SystemExit("Cloudflare MCP did not return a deployment ID.")

          try:
              asyncio.run(verify())
          except* httpx.HTTPStatusError:
              # Compare the MCP server's two identity probes without logging response bodies.
              headers = {"Authorization": "Bearer " + os.environ["CF_MCP_TOKEN"]}
              with httpx.Client(base_url="https://api.cloudflare.com/client/v4/", headers=headers) as api:
                  for label, path in [
                      ("User identity", "user"),
                      ("Account discovery", "accounts?per_page=1"),
                      ("Partner deployment", "accounts/5fb0f6d0fa99c783973d667151b868aa/workers/scripts/stam-partner-chat/deployments"),
                  ]:
                      print(f"{label}: HTTP {api.get(path).status_code}", flush=True)
              raise SystemExit("Cloudflare refused MCP authentication. Review the read checks above.")
          PY

  production:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    concurrency: partner-worker-maintenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            workers/partner
            server
            data
            tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect production worker and build source
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAM_CLOUDFLARE_MCP_TOKEN }}
          REPAIR: ${{ inputs.repair }}
        run: node workers/partner/check-production.mjs inspect
      - name: Test the replacement Worker
        if: inputs.repair && steps.inspect.outputs.roster == 'three'
        run: |
          npm ci --prefix workers/partner
          node --test tests/partner-guide.test.mjs
          npm test --prefix workers/partner
      - name: Publish tested partner code
        if: inputs.repair && steps.inspect.outputs.roster == 'three'
        env:
          CLOUDFLARE_ACCOUNT_ID: 5fb0f6d0fa99c783973d667151b868aa
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAM_CLOUDFLARE_MCP_TOKEN }}
        run: |
          # Preserve the dashboard's current budget, model and origin across the code release.
          sed '/^\[vars\]/,/^$/d' wrangler.partner.toml > wrangler.partner.release.toml
          workers/partner/node_modules/.bin/wrangler deploy --keep-vars --config wrangler.partner.release.toml
      - name: Verify deployed partner roster
        if: inputs.repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAM_CLOUDFLARE_MCP_TOKEN }}
        run: node workers/partner/check-production.mjs verify
