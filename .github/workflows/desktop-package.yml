name: Windows desktop package
on:
  push:
    branches: ['rebuild/**']
    paths: ['desktop/**', 'scripts/build-desktop.mjs', '.github/workflows/desktop-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare checked assets
        run: |
          node -e "require('node:fs').copyFileSync('.github/pages-baseline/locations.json','data/locations.json')"
          node scripts/ensure-three.mjs
          node --input-type=module -e "import {prepareScreenAssets} from './integration/log/screen-assets-node.mjs'; await prepareScreenAssets()"
      - name: Verify app tests
        run: npm test
      - name: Compile, assemble and smoke-test Windows app
        shell: powershell
        run: ./desktop/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: STAM-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish desktop]')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: STAM-Windows-x64
          path: dist
      - name: Publish verified development package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-desktop.mjs
      - name: Verify published ZIP from its public download
        run: |
          python - <<'PY'
          import json, urllib.request, hashlib, io, zipfile
          meta=json.load(open('dist/desktop-release.json'))
          with urllib.request.urlopen(meta['url'],timeout=120) as response:
              data=response.read(100*1024*1024+1)
          assert len(data)==meta['bytes']
          assert hashlib.sha256(data).hexdigest()==meta['sha256']
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              names={n.replace('\\\\','/'):n for n in z.namelist()}
              manifests=[n for n in names if n.endswith('/PACKAGE.json')]
              assert len(manifests)==1
              root=manifests[0][:-len('PACKAGE.json')]
              package=json.loads(z.read(names[manifests[0]]).decode('utf-8-sig'))
              assert package['version']==meta['version']
              for entry in package['files']:
                  content=z.read(names[root+entry['path']])
                  assert len(content)==entry['bytes']
                  assert hashlib.sha256(content).hexdigest()==entry['sha256']
          print('Public ZIP and all packaged file checksums verified.')
          PY
