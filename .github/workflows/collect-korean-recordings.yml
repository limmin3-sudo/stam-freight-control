name: Collect approved dialogue recordings
on:
  push:
    branches: [audio/elevenlabs-ko]
    paths: ['.github/workflows/collect-korean-recordings.yml']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/elevenlabs-ko
          sparse-checkout: |
            apps/control-room/src/voiceover-ko.json
            apps/control-room/src/assets/voiceover-ko
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: korean-dialogue
          run-id: '44767345314'
          github-token: ${{ github.token }}
          path: apps/control-room/src/assets/voiceover-ko
      - name: Verify catalogue and commit the recordings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path("apps/control-room/src")
          expected = {row["id"] + ".mp3" for row in json.loads((src / "voiceover-ko.json").read_text())}
          actual = {p.name for p in (src / "assets/voiceover-ko").iterdir() if p.is_file() and not p.is_symlink()}
          if expected != actual or len(actual) != 52:
              raise SystemExit("Recordings do not match the approved catalogue.")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- apps/control-room/src/assets/voiceover-ko/*.mp3
          git diff --cached --quiet || git commit -m 'Add the 52 Korean character dialogue recordings'
          git push origin HEAD:refs/heads/audio/elevenlabs-ko
