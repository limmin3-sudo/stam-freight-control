name: Read verified Windows flight captures
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45169632157
          name: STAM-Windows-x64
          path: verified
      - name: Export selected UI evidence from the verified package
        shell: python
        run: |
          from pathlib import Path
          from base64 import b64encode
          import hashlib
          for name in ['companion-ko-full.png','overlay-flight-ko.png','companion-ko-tools.png','desktop-release.json','installer-check.json','overlay-native-check.json','SHA256SUMS.txt']:
              path=next(Path('verified').rglob(name))
              data=path.read_bytes()
              assert len(data)<2000000
              print('CAPTURE-SHA',name,hashlib.sha256(data).hexdigest())
              payload=b64encode(data).decode()
              for i in range(0,len(payload),2048):
                  print('CAPTURE-DATA',name,i,payload[i:i+2048])
