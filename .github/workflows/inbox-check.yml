name: Original deck contract inbox
on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare catalogue and display labels
        run: |
          node scripts/prepare.mjs
          node scripts/build-ai-korean.mjs
      - run: npm test
      - name: Assemble independently delivered website
        run: |
          node scripts/build-public.mjs public
          node scripts/build-release.mjs public
      - name: Prepare browser
        run: |
          npm install --prefix "$RUNNER_TEMP/stam-browser" playwright@1.62.1
          "$RUNNER_TEMP/stam-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify received contract review in packaged original deck
        env:
          STAM_WEB_RELEASE: public
          STAM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/stam-browser/node_modules/playwright
        run: |
          node scripts/check-intro-guide-browser.mjs
          node scripts/check-partner-picker-browser.mjs
          node scripts/check-preparation-frame-browser.mjs
          node scripts/check-quantum-summary-browser.mjs
          node scripts/check-cargo-grids-browser.mjs
          node scripts/check-inbox-browser.mjs
          node scripts/check-inbox-batch-browser.mjs
          node scripts/check-delivery-reservations-browser.mjs
          node scripts/check-briefing-browser.mjs
          node scripts/check-public-link-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-inbox-browser
          path: |
            /tmp/stam-guide-*.png
            /tmp/stam-intro-*.png
            /tmp/stam-inbox-*.png
            /tmp/stam-briefing-*.png
            /tmp/stam-public-link-*.png
            /tmp/stam-empty-grids.png
            /tmp/stam-preparation-frame-*.png
            /tmp/stam-partner-picker-*.png
            /tmp/stam-drive-*.png
            /tmp/stam-box-summary-*.png
            /tmp/stam-reservation-*.png
          if-no-files-found: ignore
