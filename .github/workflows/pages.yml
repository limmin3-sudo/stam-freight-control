name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:23 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ensure-three.mjs
      - name: Refresh and validate map against current deployment
        run: node scripts/refresh-data.mjs --previous-url https://limmin3-sudo.github.io/verse-hauler/data/locations.json
      - run: npm test
      - name: Assemble public files only
        run: |
          mkdir public
          cp index.html style.css *.mjs public/
          cp -R data vendor assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
