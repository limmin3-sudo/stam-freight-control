name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:23 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the service centre release notes
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            try {
              const {data} = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: context.payload.before + '...' + context.sha,
              });
              const paths = (data.files || []).map(file => file.filename);
              const product = paths.some(path => /^(apps\/control-room\/(src|public)\/|desktop\/|integration\/|data\/desktop-release\.json$)/.test(path));
              if (product && !paths.includes('data/releases.json')) {
                core.warning('서비스센터 업데이트 기록을 확인하세요. 이번 푸시에는 제품 변경이 있지만 data/releases.json 변경은 없습니다.');
              }
            } catch (error) {
              core.warning('업데이트 기록 변경 여부를 확인하지 못했습니다. ' + error.message);
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ensure-three.mjs
      - name: Refresh and validate map against current deployment
        run: node scripts/refresh-data.mjs --previous-url https://limmin3-sudo.github.io/stam-freight-control/data/locations.json --fallback-file .github/pages-baseline/locations.json
      - name: Refresh SCMDB and Wiki mission supplement (keep validated snapshots on failure)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-missions.mjs
      - name: Refresh complete LIVE fleet, factory drives and log vehicle identifiers
        run: node scripts/refresh-fleet.mjs
      - name: Refresh UEX market references (retain bundled snapshot on failure)
        continue-on-error: true
        run: node --experimental-strip-types scripts/refresh-trade.ts
      - name: Build Korean display labels
        run: node scripts/build-ai-korean.mjs
      - run: npm test
      - name: Refresh public trade discussions
        run: python3 scripts/refresh-trade-news.py
      - name: Build STAM lounge
        env:
          VITE_PARTNER_API_ORIGIN: ${{ vars.STAM_PARTNER_API_ORIGIN }}
        run: npm ci --prefix apps/control-room && npm run build:control-room && npm run test:control-room
      - name: Assemble public files only
        run: node scripts/build-public.mjs public
      - name: Stamp release version and update history
        run: node scripts/build-release.mjs public
      - name: Publish lounge entry and preserve existing flight tools
        run: node scripts/publish-lounge.mjs public apps/control-room/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 15; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
              });
              if (data.artifacts.some(artifact => artifact.name === name && !artifact.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Uploaded Pages artifact metadata is not available yet.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
