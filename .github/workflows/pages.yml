name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:23 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ensure-three.mjs
      - name: Refresh and validate map against current deployment
        run: node scripts/refresh-data.mjs --previous-url https://limmin3-sudo.github.io/stam-freight-control/data/locations.json --fallback-file .github/pages-baseline/locations.json
      - name: Refresh SCMDB LIVE missions (keep last validated snapshot on failure)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-missions.mjs
      - name: Build Korean display labels
        run: node scripts/build-ai-korean.mjs
      - run: npm test
      - name: Assemble public files only
        run: node scripts/build-public.mjs public
      - name: Stamp release version and update history
        run: node scripts/build-release.mjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 15; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
              });
              if (data.artifacts.some(artifact => artifact.name === name && !artifact.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Uploaded Pages artifact metadata is not available yet.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
