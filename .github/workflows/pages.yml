name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:23 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the service centre release notes
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            try {
              const {data} = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: context.payload.before + '...' + context.sha,
              });
              const paths = (data.files || []).map(file => file.filename);
              const product = paths.some(path => /^(apps\/control-room\/(src|public)\/|desktop\/|integration\/|data\/desktop-release\.json$)/.test(path));
              if (product && !paths.includes('data/releases.json')) {
                core.warning('서비스센터 업데이트 기록을 확인하세요. 이번 푸시에는 제품 변경이 있지만 data/releases.json 변경은 없습니다.');
              }
            } catch (error) {
              core.warning('업데이트 기록 변경 여부를 확인하지 못했습니다. ' + error.message);
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ensure-three.mjs
      - name: Refresh and validate map against current deployment
        run: node scripts/refresh-data.mjs --previous-url https://limmin3-sudo.github.io/stam-freight-control/data/locations.json --fallback-file .github/pages-baseline/locations.json
      - name: Refresh SCMDB and Wiki mission supplement (keep validated snapshots on failure)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-missions.mjs
      - name: Refresh complete LIVE fleet, factory drives and log vehicle identifiers
        run: node scripts/refresh-fleet.mjs
      - name: Bundle the latest hourly UEX prices
        continue-on-error: true
        run: |
          staging="$RUNNER_TEMP/uex-prices.json"
          if git fetch --no-tags --depth=1 origin refs/heads/uex-market &&
             git show FETCH_HEAD:trade-market.json > "$staging" &&
             node --experimental-strip-types --input-type=module -e "import {validateSnapshot} from './apps/control-room/src/trade-data.ts'; import {readFileSync} from 'node:fs'; validateSnapshot(JSON.parse(readFileSync(process.argv[1],'utf8')))" "$staging"; then
            cp "$staging" data/trade-market.json
          else
            node --experimental-strip-types scripts/refresh-trade.ts
          fi
      - name: Build Korean display labels
        run: node scripts/build-ai-korean.mjs
      - run: npm test
      - name: Refresh public trade discussions
        run: python3 scripts/refresh-trade-news.py
      - name: Build STAM lounge
        env:
          VITE_PARTNER_API_ORIGIN: ${{ vars.STAM_PARTNER_API_ORIGIN }}
        run: npm ci --prefix apps/control-room && npm run build:control-room && npm run test:control-room
      - name: Assemble public files only
        run: node scripts/build-public.mjs public
      - name: Stamp release version and update history
        run: node scripts/build-release.mjs public
      - name: Publish lounge entry and preserve existing flight tools
        run: node scripts/publish-lounge.mjs public apps/control-room/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # Use the uploader's ID directly. The artifact listing seen by
      # deploy-pages can still be empty after a successful upload.
      - name: Deploy uploaded site
        id: deployment
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw Error('Missing Pages artifact ID');
            const {data} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifactId, pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            core.setOutput('page_url', data.page_url);
            core.setOutput('deployment_id', data.id || context.sha);
      - name: Verify Pages deployment
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          retries: 2
          script: |
            const params = {...context.repo, deploymentId: process.env.DEPLOYMENT_ID};
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', params);
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled',
                   'deployment_lost', 'deployment_failed_retry'].includes(data.status)) throw Error(data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', params);
            throw Error('Pages deployment timed out');
      - name: Cancel interrupted Pages deployment
        if: ${{ cancelled() && steps.deployment.outputs.deployment_id }}
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...context.repo, deploymentId: process.env.DEPLOYMENT_ID,
            });
