name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:23 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ensure-three.mjs
      - name: Refresh and validate map against current deployment
        run: node scripts/refresh-data.mjs --previous-url https://limmin3-sudo.github.io/stam-freight-control/data/locations.json --fallback-file .github/pages-baseline/locations.json
      - name: Refresh hauling mission data (keeps the bundled file if the wiki is unavailable)
        run: node scripts/refresh-missions.mjs
      - run: npm test
      - name: Prepare optional screen-reader assets with integrity checks
        run: node --input-type=module -e "import {prepareScreenAssets} from './integration/log/screen-assets-node.mjs'; await prepareScreenAssets()"
      - name: Assemble the public transport workspace
        run: node scripts/build-public.mjs public
      - name: Stamp release version and update history
        run: node scripts/build-release.mjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site and independent app update
        env:
          STAM_PLAYWRIGHT_MODULE: /tmp/stam-browser/node_modules/playwright
          STAM_WEB_PUBLIC: '1'
        run: |
          npm install --prefix /tmp/stam-browser --no-save playwright@1.56.1
          export STAM_CHROMIUM_PATH="$(command -v google-chrome)"
          node scripts/check-deployed-site.mjs
          node scripts/check-unified-deck-browser.mjs
          python scripts/check-published-app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STAM-public-verification
          path: /tmp/stam-unified-*.png
          if-no-files-found: ignore
          retention-days: 14
