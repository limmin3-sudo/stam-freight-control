name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:23 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '23 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ensure-three.mjs
      - name: Refresh and validate map against current deployment
        run: node scripts/refresh-data.mjs --previous-url https://limmin3-sudo.github.io/stam-freight-control/data/locations.json --fallback-file .github/pages-baseline/locations.json
      - name: Refresh hauling mission data (keeps the bundled file if the wiki is unavailable)
        run: node scripts/refresh-missions.mjs
      - run: npm test
      - name: Assemble public files only
        run: |
          mkdir public
          cp index.html style.css *.mjs public/
          # Rebuild entry remains on the test branch until production migration is approved.
          # Preserve the existing deployed app if this workflow is invoked on this branch.
          if [ -f legacy-planner.html ]; then cp legacy-planner.html public/index.html; fi
          cp -R data vendor public/
          cp guide.html download.html public/
          mkdir -p public/onboarding
          cp onboarding/guide.mjs onboarding/guide-data.mjs onboarding/download.mjs onboarding/guide.css public/onboarding/
          if [ -d assets ]; then cp -R assets public/; fi
          if [ -f icon.svg ]; then cp icon.svg public/; fi
          touch public/.nojekyll
      - name: Stamp release version and update history
        run: node scripts/build-release.mjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
